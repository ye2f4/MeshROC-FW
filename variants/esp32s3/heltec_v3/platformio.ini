[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3

; ============================================================================
; [env:kernel-smoke] 隔离冒烟测试 env（仅编译验证 src/kernel/ 自研栈，不编 meshtastic 固件）
; 用途：快速验证 kernel 层修复（net:: 限定、嵌套枚举返回类型、Arduino 宏污染、
;       MAX_FRAME 访问权限等），不编译 200+ meshtastic 源文件 / RadioLib / 屏幕栈。
; 触发：pio run -e kernel-smoke（输出快，分钟级）。不在 default_envs 中，不影响
;       正常 heltec-v3 构建。src/kernel_smoke_main.cpp 是唯一额外驱动文件。
; 注意：不 extends heltec-v3，因为 extends 链（kernel-smoke→heltec-v3→esp32s3_base
;       →esp32_common→arduino_base）跨 4 个文件，PlatformIO 跨 extra_configs 文件
;       解析时会丢失 platform 定义、报 UndefinedEnvPlatformError。故此处显式写
;       platform/board/framework（与 esp32_common 同款），include 路径与 heltec-v3 对齐。
;       kernel 零依赖：EnvProfile 用到的 meshtastic_Config_LoRaConfig_ModemPreset
;       仅是 protobuf 枚举常量，经 -Isrc/mesh/generated 拿头即可，无需编 nanopb 库。
; ============================================================================
[env:kernel-smoke]
extends = heltec-v3
platform =
	https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = heltec_wifi_lora_32_V3
board_level = pr
framework = arduino
build_flags =
	-std=gnu++17
	-Isrc
	-Isrc/mesh
	-Isrc/mesh/generated
	-Isrc/gps
	-Isrc/buzz
	-DHELTEC_V3
	-I variants/esp32s3/heltec_v3
build_src_filter =
	-<*>
	+<kernel/>
	+<kernel_smoke_main.cpp>
lib_extra_dirs = lib
