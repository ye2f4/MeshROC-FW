; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = heltec-v3

extra_configs =
	variants/*/*.ini
	variants/*/*/platformio.ini
	variants/*/diy/*/platformio.ini
	src/graphics/niche/InkHUD/PlatformioConfig.ini

description = MeshROC

; Shared E-Ink hardware layer (chipset drivers, panel profiles, backlight).
; Variants opt in by extending this env; unconverted variants keep the legacy
; EInkDisplay2/EInkDynamicDisplay stack. See src/graphics/eink/.
[niche]
build_src_filter =
  +<graphics/eink/>
build_flags =
  -D MESHTASTIC_INCLUDE_NICHE_GRAPHICS

[env]
test_build_src = true
; 本地库目录：优先覆盖同名依赖（如 OLEDDisplayCJK 覆盖 meshtastic 的 SSD1306 驱动，提供中文 UTF8 字体）
lib_extra_dirs = lib
extra_scripts =
	pre:bin/platformio-pre.py
	bin/platformio-custom.py
	post:extra_scripts/nrf54l15_linker.py
; note: we add src to our include search path so that lmic_project_config can override
; note: TINYGPS_OPTION_NO_CUSTOM_FIELDS is VERY important.  We don't use custom fields and somewhere in that pile
; of code is a heap corruption bug!
; FIXME: fix lib/BluetoothOTA dependency back on src/ so we can remove -Isrc
; The Radiolib stuff will speed up building considerably. Exclud all the stuff we dont need.
build_flags = -Wno-missing-field-initializers

	-Wno-format
	-Isrc -Isrc/mesh -Isrc/mesh/generated -Isrc/gps -Isrc/buzz -Wl,-Map,"${platformio.build_dir}"/output.map

; --- MESHROC 架构反转开关（见 docs/MESHROC_INVERSION.md）---
; 默认均关闭，保持 C 路线原状。取消对应注释即可切换：
;  - MESHROC_NATIVE_STACK：启用自研栈（RadioMeshRocBridge 直驱射频，旁路监听）。
;  - MESHTASTIC_AS_BRIDGE：在自研栈启用基础上，将原版 ReliableRouter 降级为翻译桥（A 选项 / 倒反天罡）。
; 两者通常一起开启才进入 A 路线；仅开前者为 C 路线（自研栈旁路）。
;	-DMESHROC_NATIVE_STACK
;	-DMESHTASTIC_AS_BRIDGE
	-DUSE_THREAD_NAMES
	-DTINYGPS_OPTION_NO_CUSTOM_FIELDS
	-DPB_ENABLE_MALLOC=1
	-DPB_VALIDATE_UTF8=1
	-DRADIOLIB_EXCLUDE_CC1101=1
	-DRADIOLIB_EXCLUDE_NRF24=1
	-DRADIOLIB_EXCLUDE_RF69=1
	-DRADIOLIB_EXCLUDE_SX1231=1
	-DRADIOLIB_EXCLUDE_SX1233=1
	-DRADIOLIB_EXCLUDE_SI443X=1
	-DRADIOLIB_EXCLUDE_RFM2X=1
	-DRADIOLIB_EXCLUDE_AFSK=1
	-DRADIOLIB_EXCLUDE_BELL=1
	-DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
	-DRADIOLIB_EXCLUDE_MORSE=1
	-DRADIOLIB_EXCLUDE_RTTY=1
	-DRADIOLIB_EXCLUDE_SSTV=1
	-DRADIOLIB_EXCLUDE_AX25=1
	-DRADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
	-DRADIOLIB_EXCLUDE_BELL=1
	-DRADIOLIB_EXCLUDE_PAGER=1
	-DRADIOLIB_EXCLUDE_FSK4=1
	-DRADIOLIB_EXCLUDE_APRS=1
	-DRADIOLIB_EXCLUDE_ADSB=1
	-DRADIOLIB_EXCLUDE_LORAWAN=1
	-DMESHTASTIC_EXCLUDE_DROPZONE=1
	-DMESHTASTIC_EXCLUDE_REPLYBOT=1
	-DMESHTASTIC_EXCLUDE_RANGETEST=1
	-DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
	-DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
	-DMESHTASTIC_EXCLUDE_POWERSTRESS=1 ; exclude power stress test module from main firmware
	-DMESHTASTIC_EXCLUDE_GENERIC_THREAD_MODULE=1
	-DMESHTASTIC_EXCLUDE_POWERMON=1
	-D MAX_THREADS=40 ; As we've split modules, we have more threads to manage
	#-DBUILD_EPOCH=$UNIX_TIME ; set in platformio-custom.py now
	#-D OLED_PL=1
	#-D DEBUG_HEAP=1 ; uncomment to add free heap space / memory leak debugging logs
	#-D DEBUG_LOOP_TIMING=1 ; uncomment to add main loop timing logs
	# 中文显示（CJK）：取消下面两行注释即为设备启用 UTF8 中文字体支持。
	# 需配合本地 lib/OLEDDisplayCJK（已覆盖 meshtastic 的 SSD1306 驱动）。仅对 SSD1306/SH1106/ST7567 类 OLED 生效，
	# EINK/TFT/ST7789 设备不受影响（Screen.cpp 中 setUtf8Font 已按显示类型守卫）。
	#-D OLED_CJK
	#-D OLED_CJK_SIZE=16 ; 可选 12 / 16 / 24，对应 utf8_12x12 / utf8_16x16 / utf8_24x24 字体

monitor_speed = 115200
monitor_filters = direct
lib_deps =
	# renovate: datasource=git-refs depName=meshtastic-esp8266-oled-ssd1306 packageName=https://github.com/meshtastic/esp8266-oled-ssd1306 gitBranch=master
	https://github.com/meshtastic/esp8266-oled-ssd1306/archive/9d9ba7e43ed1a5e1865fc9686513eab47fb079ff.zip
	# renovate: datasource=git-refs depName=meshtastic-OneButton packageName=https://github.com/meshtastic/OneButton gitBranch=master
	https://github.com/meshtastic/OneButton/archive/fa352d668c53f290cfa480a5f79ad422cd828c70.zip
	# renovate: datasource=git-refs depName=meshtastic-arduino-fsm packageName=https://github.com/meshtastic/arduino-fsm gitBranch=master
	https://github.com/meshtastic/arduino-fsm/archive/7db3702bf0cfe97b783d6c72595e3f38e0b19159.zip
	# renovate: datasource=git-refs depName=meshtastic-TinyGPSPlus packageName=https://github.com/meshtastic/TinyGPSPlus gitBranch=master
	https://github.com/meshtastic/TinyGPSPlus/archive/71a82db35f3b973440044c476d4bcdc673b104f4.zip
	# renovate: datasource=git-refs depName=meshtastic-ArduinoThread packageName=https://github.com/meshtastic/ArduinoThread gitBranch=master
	https://github.com/meshtastic/ArduinoThread/archive/b841b0415721f1341ea41cccfb4adccfaf951567.zip
	# renovate: datasource=github-tags depName=Nanopb packageName=nanopb/nanopb
	https://github.com/nanopb/nanopb/archive/refs/tags/nanopb-0.4.9.1.zip
	# renovate: datasource=github-tags depName=ErriezCRC32 packageName=Erriez/ErriezCRC32
	https://github.com/Erriez/ErriezCRC32/archive/refs/tags/1.0.1.zip

; Used for the code analysis in PIO Home / Inspect
check_tool = cppcheck
check_skip_packages = yes
check_flags =
	-DAPP_VERSION=1.0.0
	--suppressions-list=suppressions.txt
	--inline-suppr

; Common settings for conventional (non Portduino) Arduino targets
[arduino_base]
framework = arduino
lib_deps =
	${env.lib_deps}
	# renovate: datasource=github-tags depName=NonBlockingRTTTL packageName=end2endzone/NonBlockingRTTTL
	https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
build_unflags =
	-std=c++11
	-std=gnu++11
build_flags = ${env.build_flags} -Os
	-std=gnu++17
build_src_filter = ${env.build_src_filter} -<platform/> +<platform/extra_variants/> -<graphics/niche/> -<graphics/eink/>

; Common libs for communicating over TCP/IP networks such as MQTT
[networking_base]
lib_deps =
	# renovate: datasource=github-tags depName=TBPubSubClient packageName=thingsboard/pubsubclient
	https://github.com/thingsboard/pubsubclient/archive/refs/tags/v2.12.1.zip
	# renovate: datasource=github-tags depName=NTPClient packageName=arduino-libraries/NTPClient
	https://github.com/arduino-libraries/NTPClient/archive/refs/tags/3.2.1.zip

; Extra TCP/IP networking libs for supported devices
[networking_extra]
lib_deps =
	# renovate: datasource=github-tags depName=Syslog packageName=arcao/Syslog
	https://github.com/arcao/Syslog/archive/refs/tags/v2.0.zip

[radiolib_base]
lib_deps =
	# renovate: datasource=github-tags depName=RadioLib packageName=jgromes/RadioLib
	https://github.com/jgromes/RadioLib/archive/6d8934836678d8894e3d556550475b37dce3e2b6.zip

[device-ui_base]
lib_deps =
	# renovate: datasource=git-refs depName=meshtastic/device-ui packageName=https://github.com/meshtastic/device-ui gitBranch=master
	https://github.com/meshtastic/device-ui/archive/95483d8c6e28fcda2160161d5d5a8825f729df62.zip
custom_sdkconfig =
	# CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set
	CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

; Common libs for environmental measurements in telemetry module
[environmental_base]
lib_deps =
